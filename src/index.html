<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <style>
      #app-initial-loader {
        position: fixed;
        inset: 0;
        z-index: 99999;

        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;

        background: #fff;
        color: #334155;

        font-family: Tahoma, sans-serif;
        font-size: 14px;
      }

      .initial-loader__spinner {
        width: 36px;
        height: 36px;

        border: 3px solid #dbeafe;
        border-top-color: #2563eb;
        border-radius: 50%;

        animation: initial-loader-spin 0.8s linear infinite;
      }

      @keyframes initial-loader-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .initial-loader__spinner {
          animation-duration: 2s;
        }
      }
    </style>
    <meta charset="utf-8" />
    <title>Chart</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <!-- <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&family=Vazirmatn:wght@100..900&family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    /> -->
    <!-- <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"> -->
  </head>
  <body>
    <app-root>
      <div id="app-initial-loader" role="status" aria-live="polite">
        <div class="initial-loader__spinner"></div>
        <p>در حال آماده‌سازی برنامه...</p>
      </div>
    </app-root>
  </body>
</html>
